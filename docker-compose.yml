services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LIVE_FETCH: "false"
      CORS_ORIGINS: "http://localhost:3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
